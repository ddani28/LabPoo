<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo contacto</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Nuevo contacto</h1>

    <form th:action="@{/guardar}" th:object="${contacto}" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" th:field="*{apellido}" required>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}">

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" th:field="*{telefono}">

        <button type="submit">Guardar</button>
    </form>

    <p><a th:href="@{/contactos}">Ver todos los contactos</a></p>
</body>
</html>
